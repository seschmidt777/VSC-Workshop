<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        #quiz {
            margin-top: 20px;
        }
        #result {
            font-size: 2em;
            color: green;
            margin-top: 30px;
        }
        #incorrect {
            color: red;
            margin-top: 20px;
        }
        .animate-g {
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <h1>VS Code Quiz</h1>
    <div id="quiz">
        <p id="question">Frage wird hier angezeigt...</p>
        <input type="text" id="answer" placeholder="Antwort eingeben">
        <button onclick="submitAnswer()">Antwort senden</button>
    </div>
    <div id="result"></div>
    <div id="incorrect"></div>

    <script>
        
        const questions = [
            { question: "Wie nennt man die Funktion in VS Code, die Code automatisch vervollständigt?", encodedAnswer: "aW50ZWxsaXNlbnNl" }, 
            { question: "Welcher Bereich in VS Code zeigt alle Dateien und Ordner deines Projekts an?", encodedAnswer: "ZXhwbG9yZXI=" }, 
            { question: "Mit welchem Befehl in VS Code kannst du den Code automatisch formatieren?", encodedAnswer: "Zm9ybWF0IGRvY3VtZW50" }, 
            { question: "Wie nennt man in VS Code kleine Programme zur Erweiterung der Funktionalität?", encodedAnswer: "ZXJ3ZWl0ZXJ1bmdlbg==" }, 
            { question: "Wie heißt die Konsole in VS Code, in der du Fehler und Ausgaben sehen kannst?", encodedAnswer: "dGVybWluYWw=" }, 
            { question: "In welchem Jahr wurde Visual Studio Code erstmals veröffentlicht?", encodedAnswer: "MjAxNQ==" }, 
            { question: "Wie heißt die Funktion, die es dir erlaubt, mehrere Stellen im Code gleichzeitig zu bearbeiten?", encodedAnswer: "bXVsdGktY3Vyc29y" }, 
            { question: "Wie kannst du in VS Code alle installierten Erweiterungen anzeigen?", encodedAnswer: "ZXh0ZW5zaW9ucyB2aWV3" }, 
            { question: "Wie nennt man den Bereich, der dir Fehler und Warnungen im Code anzeigt?", encodedAnswer: "cHJvYmxlbXMgcGFuZWw=" }, 
            { question: "Wie speichert VS Code benutzerdefinierte Projekteinstellungen?", encodedAnswer: "c2V0dGluZ3MuanNvbg==" } 
        ];

        let currentQuestion = 0;
        let score = 0;
        let incorrectAnswers = [];

        
        function decodeBase64(encoded) {
            return atob(encoded);
        }

        function displayQuestion() {
            document.getElementById("question").textContent = questions[currentQuestion].question;
            document.getElementById("answer").value = "";
        }

        function submitAnswer() {
            const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
            const correctAnswer = decodeBase64(questions[currentQuestion].encodedAnswer);

            if (userAnswer === correctAnswer) {
                score++;
            } else {
                incorrectAnswers.push({
                    question: questions[currentQuestion].question,
                    userAnswer: document.getElementById("answer").value.trim()
                });
            }
            currentQuestion++;

            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const resultElement = document.getElementById("result");
            const incorrectElement = document.getElementById("incorrect");

            if (score === questions.length) {
                resultElement.textContent = "G";
                resultElement.classList.add("animate-g");
            } else {
                resultElement.textContent = `Du hast ${score} von ${questions.length} richtig.`;
                incorrectElement.innerHTML = "<h3>Falsche Antworten:</h3>";
                incorrectAnswers.forEach(item => {
                    incorrectElement.innerHTML += `<p>Frage: ${item.question}<br>Deine Antwort: ${item.userAnswer}</p><br>`;
                });
            }

            resultElement.style.display = "block";
            incorrectElement.style.display = "block";
        }

        displayQuestion();
    </script>
</body>
</html>
