<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        #quiz {
            margin-top: 20px;
        }
        #result {
            font-size: 2em;
            color: green;
            margin-top: 30px;
        }
        #incorrect {
            color: red;
            margin-top: 20px;
        }
        .animate-g {
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <h1>VS Code Quiz</h1>
    <div id="quiz">
        <p id="question">Frage wird hier angezeigt...</p>
        <input type="text" id="answer" placeholder="Antwort eingeben">
        <button onclick="submitAnswer()">Antwort senden</button>
    </div>
    <div id="result"></div>
    <div id="incorrect"></div>

    <script>
        const questions = [
            { question: "Welches Framework ermöglicht es, dass VS Code auf Windows, Linux und macOS läuft?", encodedAnswer: "RWxlY3Ryb24=" },
            { question: "Welches Entwicklungsmodell fördert die Community, indem sie an Erweiterungen für VS Code arbeitet?", encodedAnswer: "T3BlbiBTb3VyY2U=" },
            { question: "Für welchen Entwicklungsbereich wurde VS Code ursprünglich optimiert?", encodedAnswer: "V2Vi" },
            { question: "Welche Funktion in VS Code ermöglicht es, in Containern oder auf entfernten Maschinen zu entwickeln?", encodedAnswer: "UmVtb3Rl" },
            { question: "Welcher Cloud-Dienst ist eng in die Funktionen von VS Code integriert?", encodedAnswer: "QXp1cmU=" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let incorrectAnswers = [];

        function decodeBase64(encoded) {
            return atob(encoded);
        }

        function displayQuestion() {
            document.getElementById("question").textContent = questions[currentQuestion].question;
            document.getElementById("answer").value = "";
        }

        function submitAnswer() {
            const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
            const correctAnswer = decodeBase64(questions[currentQuestion].encodedAnswer).toLowerCase();

            if (userAnswer === correctAnswer) {
                score++;
            } else {
                incorrectAnswers.push({
                    question: questions[currentQuestion].question,
                    userAnswer: document.getElementById("answer").value.trim()
                });
            }
            currentQuestion++;

            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const resultElement = document.getElementById("result");
            const incorrectElement = document.getElementById("incorrect");

            if (score === questions.length) {
                resultElement.textContent = "G";
                resultElement.classList.add("animate-g");
            } else {
                resultElement.textContent = `Du hast ${score} von ${questions.length} richtig.`;
                incorrectElement.innerHTML = "<h3>Falsche Antworten:</h3>";
                incorrectAnswers.forEach(item => {
                    incorrectElement.innerHTML += `<p>Frage: ${item.question}<br>Deine Antwort: ${item.userAnswer}</p><br>`;
                });
            }

            resultElement.style.display = "block";
            incorrectElement.style.display = "block";
        }

        displayQuestion();
    </script>
</body>
</html>
